<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AIROOM - Multi-Theme WebAR</title>

  <!-- A-Frame & 8th Wall Extras -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- Self-Hosted 8th Wall XR Engine Binary (Make sure xr.js is in your AIROOM folder) -->
  <script async src="./xr.js"></script>

  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a;
    }

    /* Custom Branded Loading Screen (Replaces xrextras-loading & removes 8th Wall badge) */
    #custom-loader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Backup CSS just in case any default branding injects */
    .poweredby-img, #poweredByLogo, #loadingContainer {
      display: none !important;
    }

    /* Instruction Banner before tapping floor */
    #hint-banner {
      position: fixed; 
      top: 24px; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); 
      color: #fff; 
      padding: 12px 22px;
      border-radius: 30px; 
      font-size: 14px; 
      font-weight: 500; 
      z-index: 10;
      backdrop-filter: blur(8px); 
      pointer-events: none; 
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    /* Bottom Theme Switcher Dock (Hidden until floor is anchored) */
    #theme-dock {
      position: fixed; 
      bottom: 28px; 
      left: 50%; 
      transform: translateX(-50%);
      display: none; 
      gap: 8px; 
      background: rgba(15, 23, 42, 0.88);
      padding: 8px; 
      border-radius: 40px; 
      z-index: 10;
      backdrop-filter: blur(10px); 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .theme-btn {
      border: none; 
      padding: 10px 16px; 
      border-radius: 30px;
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer;
      color: #cbd5e1; 
      background: transparent; 
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .theme-btn.active {
      background: #10b981; 
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
    }

    /* Recenter Button */
    #recenter-btn {
      position: fixed; 
      top: 24px; 
      right: 16px; 
      z-index: 10;
      background: rgba(15, 23, 42, 0.75); 
      color: #fff; 
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; 
      width: 42px; 
      height: 42px; 
      font-size: 18px; 
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <script>
    // Custom Component: Handles Loader Dismissal & Tap-to-Place 360° Room Anchor
    AFRAME.registerComponent('room-anchor-manager', {
      init: function () {
        const scene = this.el;
        const roomRoot = document.getElementById('room-origin');
        const hintBanner = document.getElementById('hint-banner');
        const themeDock = document.getElementById('theme-dock');
        const customLoader = document.getElementById('custom-loader');
        let isAnchored = false;

        // 1. Hide custom loading screen once AR camera feed is ready
        scene.addEventListener('realityready', () => {
          if (customLoader) {
            customLoader.style.opacity = '0';
            setTimeout(() => customLoader.remove(), 400);
          }
        });

        // 2. Tap anywhere on the screen to place the (0,0,0) room anchor on the floor
        scene.addEventListener('click', (event) => {
          if (isAnchored) return;

          const touchPoint = event.detail.intersection 
            ? event.detail.intersection.point 
            : { x: 0, y: 0, z: -2.5 };
          
          roomRoot.setAttribute('position', `${touchPoint.x} ${touchPoint.y} ${touchPoint.z}`);
          roomRoot.setAttribute('visible', 'true');
          isAnchored = true;

          // Update UI
          hintBanner.style.display = 'none';
          themeDock.style.display = 'flex';
        });

        // 3. Recenter button lets user reset AR tracking if needed
        document.getElementById('recenter-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          scene.emit('recenter');
        });
      }
    });

    // Global function to switch themes anywhere in the room instantly
    function switchTheme(themeName, btnElement) {
      const themes = ['forest', 'mountain', 'ocean'];
      
      themes.forEach(t => {
        const container = document.getElementById(`theme-${t}`);
        if (container) {
          container.setAttribute('visible', t === themeName);
        }
      });

      // Update active button styling
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>
</head>

<body>
  <!-- Custom Loading Screen (No 8th Wall Branding) -->
  <div id="custom-loader">
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-size: 14px; font-weight: 500; letter-spacing: 0.5px;">Initializing AR Room...</p>
  </div>

  <!-- UI Overlays -->
  <div id="hint-banner">Point at the floor & tap once to place the room</div>
  <button id="recenter-btn" title="Recenter AR">⟲</button>

  <div id="theme-dock">
    <button class="theme-btn active" onclick="switchTheme('forest', this)">🌲 Forest</button>
    <button class="theme-btn" onclick="switchTheme('mountain', this)">⛰️ Mountain</button>
    <button class="theme-btn" onclick="switchTheme('ocean', this)">🌊 Ocean</button>
  </div>

  <!-- 8th Wall World Effects Scene (xrextras-loading removed) -->
  <a-scene
    room-anchor-manager
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any">

    <!-- Camera & Ground Raycaster -->
    <a-camera position="0 1.6 0" raycaster="objects: .ground-plane" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!-- Invisible Floor Plane for Tap-to-Place Raycasting -->
    <a-plane class="ground-plane" position="0 0 0" rotation="-90 0 0" width="50" height="50" visible="false"></a-plane>

    <!-- Ambient & Directional Lighting -->
    <a-light type="ambient" intensity="0.85"></a-light>
    <a-light type="directional" position="2 5 3" intensity="0.9"></a-light>

    <!-- =================================================================== -->
    <!-- ROOM ORIGIN (0, 0, 0) - Everything below anchors to your floor tap  -->
    <!-- =================================================================== -->
    <a-entity id="room-origin" visible="false">

      <!-- THEME 1: FOREST (Active by default) -->
      <a-entity id="theme-forest" visible="true">
        <!-- Back-Left Corner Tree -->
        <a-cone position="-2.5 1.5 -3.5" radius-bottom="1" height="3" color="#15803d"></a-cone>
        <!-- Back-Right Corner Tree -->
        <a-cone position="2.5 1.8 -3.5" radius-bottom="1.2" height="3.6" color="#166534"></a-cone>
        <!-- Center Floor Pond -->
        <a-cylinder position="0 0.05 -1.5" radius="0.9" height="0.1" color="#0ea5e9"></a-cylinder>
        <!-- Overhead Floating Firefly -->
        <a-sphere position="-0.8 2.4 -2" radius="0.12" color="#fde047" animation="property: position; to: -0.6 2.7 -2; dir: alternate; loop: true; dur: 2000"></a-sphere>
        <!-- Behind User (Turn around 180° to see) -->
        <a-cone position="1.5 1.4 2.5" radius-bottom="0.9" height="2.8" color="#14532d"></a-cone>
      </a-entity>

      <!-- THEME 2: MOUNTAIN -->
      <a-entity id="theme-mountain" visible="false">
        <!-- Back-Left Snowy Peak -->
        <a-cone position="-2.5 2 -3.8" radius-bottom="1.8" height="4" color="#64748b"></a-cone>
        <!-- Back-Right Snowy Peak -->
        <a-cone position="2.5 2.2 -3.8" radius-bottom="2" height="4.4" color="#475569"></a-cone>
        <!-- Center Floor Campfire -->
        <a-cone position="0 0.35 -1.5" radius-bottom="0.4" height="0.7" color="#f97316" animation="property: scale; to: 1.1 1.25 1.1; dir: alternate; loop: true; dur: 600"></a-cone>
        <!-- Overhead Drifting Cloud -->
        <a-box position="0.5 2.6 -2.2" width="1.6" height="0.35" depth="0.9" color="#f8fafc" opacity="0.85"></a-box>
      </a-entity>

      <!-- THEME 3: OCEAN -->
      <a-entity id="theme-ocean" visible="false">
        <!-- Coral Reef Left -->
        <a-dodecahedron position="-2.2 0.6 -3.2" radius="0.7" color="#f43f5e"></a-dodecahedron>
        <!-- Coral Reef Right -->
        <a-dodecahedron position="2.2 0.7 -3.2" radius="0.8" color="#a855f7"></a-dodecahedron>
        <!-- Overhead Swimming Whale / Fish Placeholder -->
        <a-box position="0 2.3 -2.5" width="1.8" height="0.5" depth="0.6" color="#0284c7" animation="property: position; from: -2.5 2.3 -2.5; to: 2.5 2.3 -2.5; dir: alternate; loop: true; dur: 4500"></a-box>
      </a-entity>

    </a-entity>
  </a-scene>
</body>
</html>
